# Portões da constituição que dá para checar por comando (Governance, "Portões
# obrigatórios em todo PR"): tipos, testes (inclui texto literal em tela e
# idempotência da ingestão), fronteiras de importação, painel sem banco local
# e o servidor contra um Postgres descartável.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App de campo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:fronteira

  painel:
    name: Painel
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: painel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: painel/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run check:sem-banco

  servidor:
    name: Servidor (Postgres)
    runs-on: ubuntu-24.04
    # Sem `services: postgres`: servidor/teste/rodar.sh não se conecta a um
    # banco existente nem lê variável de ambiente. Ele mesmo sobe um Postgres
    # descartável com initdb/pg_ctl num diretório temporário, escutando só num
    # socket local, e precisa de initdb, pg_ctl e psql (15+) no PATH. A imagem
    # ubuntu-24.04 já traz o Postgres 16 em /usr/lib/postgresql/16/bin, fora do
    # PATH; se não trouxer, instala.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Postgres 16 no PATH
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run servidor:teste
